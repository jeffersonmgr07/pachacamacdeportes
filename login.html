<!DOCTYPE html>
<html lang="es">
<head>
  <title>Acceso · Minetti Fútbol</title>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Torneo Municipal de Fútbol de Menores 2026 - fixture, resultados, tabla y paneles." />
<link rel="stylesheet" href="assets/css/styles.css" />
<script src="assets/js/config.js"></script>
<script src="assets/js/mock-data.js"></script>
<script src="assets/js/api.js"></script>

</head>
<body>
  <script src="assets/components/header.js"></script>
  <main class="login-shell">
    <section class="login-card">
      <div class="brand" style="color:#06101f;margin-bottom:20px"><span class="brand-shield">MF</span><span><strong>Acceso privado</strong><small>Entrenadores y administración</small></span></div>
      <div class="tabs">
        <button class="tab-btn active" data-fill="guerreros">Entrenador demo</button>
        <button class="tab-btn" data-fill="admin">Admin demo</button>
      </div>
      <form id="loginForm">
        <div style="margin-bottom:14px">
          <label>Usuario</label>
          <input id="username" name="username" autocomplete="username" placeholder="Ejemplo: guerreros" required />
        </div>
        <div style="margin-bottom:18px">
          <label>Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Ejemplo: demo123" required />
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%">Ingresar al panel</button>
        <p class="sub" style="margin-top:16px">Usuarios demo: <b>guerreros/demo123</b> o <b>admin/admin123</b>.</p>
      </form>
    </section>
  </main>
  <script src="assets/js/login.js"></script>
</body>
</html>
