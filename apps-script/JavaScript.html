
<script>
const ROUTE = '<?= route ?>';
const TOKEN = '<?= token ?>';
const BASE_URL = '<?= baseUrl ?>';
let STATE = null;
let selectedMatch = null;
let starters = [];
let substitutes = [];

document.addEventListener('DOMContentLoaded', () => {
  setActiveNav();
  google.script.run
    .withSuccessHandler(data => { STATE = data; render(); })
    .withFailureHandler(err => showError(err.message || err))
    .getInitialData(ROUTE, TOKEN);
});

function url(page, extra=''){
  return BASE_URL + '?page=' + encodeURIComponent(page) + extra;
}

function setActiveNav(){
  document.querySelectorAll('[data-nav]').forEach(a => {
    if(a.dataset.nav === ROUTE || (ROUTE === 'inicio' && a.dataset.nav === 'inicio')) a.classList.add('active');
  });
}

function render(){
  const app = document.getElementById('app');
  if(!STATE || !STATE.ok){ app.innerHTML = '<div class="loading">No se pudo cargar la información.</div>'; return; }
  const route = STATE.route || 'inicio';
  if(route === 'fixture') app.innerHTML = viewFixture();
  else if(route === 'resultados') app.innerHTML = viewResults();
  else if(route === 'tabla') app.innerHTML = viewStandings();
  else if(route === 'equipos') app.innerHTML = viewTeams();
  else if(route === 'delegado') app.innerHTML = viewDelegate();
  else if(route === 'admin') app.innerHTML = viewAdmin();
  else app.innerHTML = viewHome();
}

function viewHome(){
  const p = STATE.publicData;
  return `
    <section class="hero">
      <div class="wrap">
        <div>
          <span class="badge">Campeonato local de fútbol de menores</span>
          <h1>${escapeHtml(STATE.config.APP_NAME || 'Minetti Fútbol')}</h1>
          <p>${escapeHtml(STATE.config.TOURNAMENT_NAME || '')}<br>${escapeHtml(STATE.config.VENUE || '')}</p>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
            <a class="btn secondary" href="${url('fixture')}">Ver fixture</a>
            <a class="btn" href="${url('delegado','&token=demo-guerreros-sub6')}">Demo delegado</a>
          </div>
        </div>
        <div class="card" style="background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:white">
          <h2>Próximos partidos</h2>
          ${(p.upcoming || []).slice(0,4).map(matchMini).join('') || '<p>No hay próximos partidos cargados.</p>'}
        </div>
      </div>
    </section>
    <section class="section"><div class="wrap grid grid-3">
      <div class="card kpi"><div><strong>${p.teams.length}</strong><div class="muted">Equipos registrados</div></div></div>
      <div class="card kpi"><div><strong>${p.fixture.length}</strong><div class="muted">Partidos en fixture</div></div></div>
      <div class="card kpi"><div><strong>${p.results.length}</strong><div class="muted">Resultados cargados</div></div></div>
    </div></section>
    <section class="section"><div class="wrap grid grid-2">
      <div class="card"><h2>Últimos resultados</h2>${resultsTable(p.latestResults || [])}</div>
      <div class="card"><h2>Tabla rápida Sub 6</h2>${standingsTable((p.standings || []).filter(r=>r.categoryId==='sub6'))}</div>
    </div></section>`;
}

function viewFixture(){
  const p = STATE.publicData;
  return pageShell('Fixture público', 'Programación completa, resultados cargados y próximos partidos.', `
    ${filtersHtml()}
    <div id="fixtureTable">${fixtureTable(p.fixture)}</div>
  `);
}

function viewResults(){
  const p = STATE.publicData;
  return pageShell('Resultados', 'Partidos jugados y marcadores oficiales cargados en Google Sheets.', resultsTable(p.results || []));
}

function viewStandings(){
  const p = STATE.publicData;
  return pageShell('Tabla de posiciones', 'Cálculo automático por categoría y grupo desde los resultados.', standingsGrouped(p.standings || []));
}

function viewTeams(){
  const p = STATE.publicData;
  const groups = groupBy(p.teams, r => `${r.categoryName} · ${r.group}`);
  return pageShell('Equipos participantes', 'Listado cargado desde la hoja Equipos.', Object.keys(groups).map(k => `
    <div class="card" style="margin-bottom:16px"><h3>${escapeHtml(k)}</h3>
    <div class="grid grid-3">${groups[k].map(t=>`<div class="badge">${escapeHtml(t.name)}</div>`).join('')}</div></div>`).join(''));
}

function viewAdmin(){
  const p = STATE.publicData;
  const pending = (p.fixture || []).filter(m => m.away && m.status !== 'jugado').slice(0, 40);
  return pageShell('Panel administrador simple', 'Actualiza resultados desde aquí o directamente en la hoja Fixture de Google Sheets.', `
    <div class="notice">Para edición masiva, abre el Google Sheet y modifica las pestañas Fixture, Equipos, Jugadores y Delegados. Esta página es una ayuda rápida para cargar marcadores.</div>
    <div style="height:14px"></div>
    <div class="card"><h3>Cargar resultado</h3>
      <div class="form-row">
        <div><label>Partido</label><select id="adminMatch">${pending.map(m=>`<option value="${m.id}">${m.dateLabel} · ${m.time || 'S/H'} · ${m.home} vs ${m.away}</option>`).join('')}</select></div>
        <div><label>Goles local</label><input id="adminHomeScore" type="number" min="0" value="0"></div>
        <div><label>Goles visita</label><input id="adminAwayScore" type="number" min="0" value="0"></div>
        <div><label>Tipo</label><select id="adminType"><option value="normal">Normal</option><option value="wo">W.O.</option><option value="reclamo">Reclamo</option></select></div>
      </div>
      <div style="margin-top:12px"><label>Nota</label><input id="adminNote" placeholder="Opcional"></div>
      <button class="btn" style="margin-top:14px" onclick="saveAdminResult()">Guardar resultado</button>
      <div id="adminMsg" style="margin-top:12px"></div>
    </div>
  `);
}

function viewDelegate(){
  const d = STATE.delegateData;
  if(!d) return pageShell('Acceso delegado', '', '<div class="notice">Token no válido o equipo no encontrado.</div>');
  if(!selectedMatch && d.upcomingMatches && d.upcomingMatches.length) selectedMatch = d.upcomingMatches[0].id;
  const available = d.players.filter(p => !starters.includes(p.playerId) && !substitutes.includes(p.playerId) && (p.status || '').toLowerCase() === 'aprobado');
  const maxStarters = Number(d.category.playersOnField || 7);
  const minPlayers = Number(d.category.minPlayersOnField || 5);
  return pageShell('Acceso de delegado', `${d.team.name} · ${d.team.categoryName} · ${d.team.group}`, `
    <div class="grid grid-3">
      <div class="card"><span class="badge">Delegado</span><h3>${escapeHtml(d.delegate.delegateName)}</h3><p class="muted">${escapeHtml(d.delegate.phone || '')}</p></div>
      <div class="card"><span class="badge">Regla</span><h3>${maxStarters} titulares</h3><p class="muted">Mínimo para iniciar: ${minPlayers}</p></div>
      <div class="card"><span class="badge">Padrón</span><h3>${d.players.length} jugadores</h3><p class="muted">Fotos desde Drive por DNI.png</p></div>
    </div>

    <div class="section">
      <h2>Nómina general de jugadores</h2>
      <div class="grid grid-3">${d.players.map(playerCard).join('')}</div>
    </div>

    <div class="section">
      <h2>Próximos partidos</h2>
      <div class="grid grid-3">${(d.upcomingMatches || []).map(m => `
        <div class="match-option ${selectedMatch===m.id?'selected':''}" onclick="selectMatch('${m.id}')">
          <span class="badge">${escapeHtml(m.dateLabel || 'Fecha')}</span>
          <h3>${escapeHtml(m.home)} vs ${escapeHtml(m.away)}</h3>
          <p class="muted">${escapeHtml(m.field || 'Campo por confirmar')} · ${escapeHtml(m.time || 'Hora por confirmar')}</p>
        </div>`).join('')}</div>
    </div>

    <div class="section">
      <div class="card">
        <h2>Convocatoria del partido</h2>
        <p class="muted">Elige jugadores aprobados. Al agregarlos, desaparecen de la lista disponible.</p>
        <div class="form-row" style="grid-template-columns:2fr 1fr 1fr">
          <div><label>Jugador disponible</label><select id="playerSelect">${available.map(p=>`<option value="${p.playerId}">${escapeHtml(p.fullName)} · DNI ${p.dni}</option>`).join('')}</select></div>
          <div><label>Rol</label><select id="roleSelect"><option value="titular">Titular</option><option value="suplente">Suplente</option></select></div>
          <div style="display:flex;align-items:end"><button class="btn" onclick="addSelectedPlayer()" ${available.length?'':'disabled'}>Agregar al partido</button></div>
        </div>

        <div class="grid grid-2" style="margin-top:20px">
          <div><h3>Titulares (${starters.length}/${maxStarters})</h3><div class="roster-box">${rosterList(starters, 'titular')}</div></div>
          <div><h3>Suplentes (${substitutes.length})</h3><div class="roster-box">${rosterList(substitutes, 'suplente')}</div></div>
        </div>

        <div style="margin-top:18px" class="${starters.length >= minPlayers ? 'success' : 'notice'}">
          ${starters.length >= minPlayers ? 'La convocatoria tiene el mínimo para iniciar el partido.' : `Faltan ${minPlayers - starters.length} titulares para llegar al mínimo reglamentario.`}
        </div>
        <button class="btn" style="margin-top:16px" onclick="saveCallup()" ${selectedMatch && starters.length>=minPlayers ? '' : 'disabled'}>Guardar convocatoria</button>
        <div id="callupMsg" style="margin-top:12px"></div>
      </div>
    </div>
  `);
}

function filtersHtml(){
  const categories = STATE.publicData.categories || [];
  return `<div class="filters">
    <select onchange="filterFixture()" id="filterCategory"><option value="">Todas las categorías</option>${categories.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}</select>
    <select onchange="filterFixture()" id="filterStatus"><option value="">Todos los estados</option><option value="jugado">Jugado</option><option value="programado">Programado</option><option value="descansa">Descansa</option></select>
  </div>`;
}

function filterFixture(){
  const cat = document.getElementById('filterCategory').value;
  const status = document.getElementById('filterStatus').value;
  let rows = STATE.publicData.fixture || [];
  if(cat) rows = rows.filter(r=>r.categoryId===cat);
  if(status) rows = rows.filter(r=>r.status===status);
  document.getElementById('fixtureTable').innerHTML = fixtureTable(rows);
}

function fixtureTable(rows){
  return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Campo</th><th>Hora</th><th>Categoría</th><th>Partido</th><th>Estado</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${escapeHtml(r.dateLabel)}</td><td>${escapeHtml(r.field)}</td><td>${escapeHtml(r.time)}</td><td>${escapeHtml(r.categoryLabel || r.categoryName || r.categoryId)}</td><td><strong>${escapeHtml(r.home)}</strong> ${r.away ? scoreOrVs(r) : ''} <strong>${escapeHtml(r.away || '')}</strong></td><td>${escapeHtml(r.status)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function resultsTable(rows){
  if(!rows.length) return '<div class="notice">Todavía no hay resultados cargados.</div>';
  return `<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Partido</th><th>Marcador</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${escapeHtml(r.dateLabel)}</td><td>${escapeHtml(r.categoryLabel)}</td><td>${escapeHtml(r.home)} vs ${escapeHtml(r.away)}</td><td><span class="score">${r.homeScore} - ${r.awayScore}</span></td></tr>`).join('')}
  </tbody></table></div>`;
}

function standingsGrouped(rows){
  const groups = groupBy(rows, r => `${r.categoryName} · ${r.group}`);
  return Object.keys(groups).map(k=>`<div class="card" style="margin-bottom:18px"><h3>${escapeHtml(k)}</h3>${standingsTable(groups[k])}</div>`).join('');
}

function standingsTable(rows){
  return `<div class="table-wrap"><table><thead><tr><th>Pos</th><th>Equipo</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th>PTS</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><strong>${r.position || ''}</strong></td><td><strong>${escapeHtml(r.team)}</strong></td><td>${r.pj}</td><td>${r.pg}</td><td>${r.pe}</td><td>${r.pp}</td><td>${r.gf}</td><td>${r.gc}</td><td>${r.dg>0?'+'+r.dg:r.dg}</td><td><strong>${r.pts}</strong></td></tr>`).join('')}
  </tbody></table></div>`;
}

function matchMini(m){
  return `<div style="background:white;color:#0f172a;border-radius:16px;padding:12px;margin-bottom:10px">
    <div class="muted">${escapeHtml(m.categoryLabel || '')} · ${escapeHtml(m.time || 'S/H')}</div>
    <strong>${escapeHtml(m.home)} vs ${escapeHtml(m.away)}</strong>
  </div>`;
}

function playerCard(p){
  const img = p.photoUrl ? `<img class="avatar" src="${p.photoUrl}" onerror="this.outerHTML=avatarFallback('${initials(p.fullName)}')">` : avatarFallback(initials(p.fullName));
  return `<div class="card player-card">${img}<div><h3 style="margin:0 0 6px">${escapeHtml(p.fullName)}</h3>
    <div class="player-meta"><strong>DNI:</strong> ${escapeHtml(p.dni)}<br><strong>Fecha nacimiento:</strong> ${formatDate(p.birthDate)}<br><strong>Estado:</strong> ${escapeHtml(p.status)}</div></div></div>`;
}

function avatarFallback(text){ return `<div class="avatar-fallback">${escapeHtml(text)}</div>`; }
function initials(name){ return String(name||'').split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase(); }

function rosterList(ids, role){
  const players = STATE.delegateData.players || [];
  if(!ids.length) return '<p class="muted">Sin jugadores agregados.</p>';
  return ids.map(id => {
    const p = players.find(x => x.playerId === id);
    return `<div class="roster-item"><span>${escapeHtml(p ? p.fullName : id)}</span><button class="btn ghost" onclick="removePlayer('${id}','${role}')">Quitar</button></div>`;
  }).join('');
}

function selectMatch(id){ selectedMatch = id; starters = []; substitutes = []; render(); }
function addSelectedPlayer(){
  const playerId = document.getElementById('playerSelect').value;
  const role = document.getElementById('roleSelect').value;
  const maxStarters = Number(STATE.delegateData.category.playersOnField || 7);
  if(!playerId) return;
  if(role === 'titular'){
    if(starters.length >= maxStarters) return alert('Ya alcanzaste el máximo de titulares.');
    starters.push(playerId);
  } else {
    substitutes.push(playerId);
  }
  render();
}
function removePlayer(id, role){
  if(role === 'titular') starters = starters.filter(x=>x!==id);
  else substitutes = substitutes.filter(x=>x!==id);
  render();
}
function saveCallup(){
  const payload = { token:TOKEN, matchId:selectedMatch, starters, substitutes, notes:'' };
  document.getElementById('callupMsg').innerHTML = '<div class="notice">Guardando...</div>';
  google.script.run.withSuccessHandler(res => {
    document.getElementById('callupMsg').innerHTML = `<div class="success">${res.message}<br>ID: ${res.callupId}</div>`;
  }).withFailureHandler(err => {
    document.getElementById('callupMsg').innerHTML = `<div class="notice">${escapeHtml(err.message || err)}</div>`;
  }).saveCallup(payload);
}
function saveAdminResult(){
  const payload = {
    matchId: document.getElementById('adminMatch').value,
    homeScore: document.getElementById('adminHomeScore').value,
    awayScore: document.getElementById('adminAwayScore').value,
    resultType: document.getElementById('adminType').value,
    note: document.getElementById('adminNote').value,
    status: 'jugado'
  };
  document.getElementById('adminMsg').innerHTML = '<div class="notice">Guardando...</div>';
  google.script.run.withSuccessHandler(res => {
    document.getElementById('adminMsg').innerHTML = `<div class="success">${res.message}</div>`;
    google.script.run.withSuccessHandler(data => { STATE = data; render(); }).getInitialData(ROUTE, TOKEN);
  }).withFailureHandler(err => {
    document.getElementById('adminMsg').innerHTML = `<div class="notice">${escapeHtml(err.message || err)}</div>`;
  }).updateFixtureResult(payload);
}

function pageShell(title, subtitle, body){
  return `<section class="section"><div class="wrap"><h1>${escapeHtml(title)}</h1><p class="muted">${escapeHtml(subtitle||'')}</p>${body}</div></section>`;
}
function scoreOrVs(r){ return r.status === 'jugado' ? `<span class="score">${r.homeScore} - ${r.awayScore}</span>` : '<span class="muted">vs</span>'; }
function groupBy(arr, fn){ return arr.reduce((acc,x)=>{ const k=fn(x); (acc[k]=acc[k]||[]).push(x); return acc; },{}); }
function escapeHtml(v){ return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
function formatDate(v){
  if(!v) return '';
  try { return new Date(v).toLocaleDateString('es-PE',{year:'numeric',month:'2-digit',day:'2-digit'}); } catch(e){ return v; }
}
function showError(msg){
  document.getElementById('app').innerHTML = `<section class="section"><div class="wrap"><div class="notice">${escapeHtml(msg)}</div></div></section>`;
}
</script>
