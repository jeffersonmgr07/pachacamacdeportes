<style>
:root{
  --navy:#07111f;
  --navy2:#0f172a;
  --green:#16a34a;
  --green-dark:#064e3b;
  --gold:#f8c44f;
  --gold2:#fde68a;
  --muted:#64748b;
  --line:#e2e8f0;
  --bg:#f5f7fb;
  --card:#ffffff;
  --ink:#0f172a;
  --danger:#dc2626;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1220px;margin:0 auto;padding:0 18px}
.site-header{position:sticky;top:0;z-index:40;background:rgba(7,17,31,.96);color:#fff;box-shadow:0 12px 35px rgba(2,6,23,.22)}
.league-strip{background:#020617;border-bottom:1px solid rgba(255,255,255,.10);font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#cbd5e1}
.league-strip-inner{display:flex;justify-content:space-between;gap:14px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.main-nav-wrap{border-bottom:1px solid rgba(255,255,255,.10)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content}
.crest{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--gold),#fff4b8);color:#07111f;font-weight:1000;box-shadow:0 0 0 5px rgba(248,196,79,.16);letter-spacing:-.04em}
.brand small{display:block;color:var(--gold);font-size:10px;font-weight:1000;text-transform:uppercase;letter-spacing:.12em}.brand span{display:block;font-size:22px;font-weight:1000;letter-spacing:-.03em;color:#fff}
.menu{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.menu a{font-weight:900;font-size:13px;padding:10px 12px;border-radius:999px;color:#e2e8f0;border:1px solid transparent}.menu a:hover,.menu a.active{background:rgba(248,196,79,.15);border-color:rgba(248,196,79,.35);color:var(--gold2)}.menu a.admin-link{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.22)}
.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 8% 20%,rgba(248,196,79,.24),transparent 28%),radial-gradient(circle at 82% 18%,rgba(34,197,94,.20),transparent 28%),linear-gradient(135deg,#07111f 0%,#0f172a 52%,#064e3b 100%);color:#fff}
.hero:after{content:"";position:absolute;inset:auto -8% -44% -8%;height:54%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 88px,rgba(255,255,255,.018) 88px 176px);transform:skewY(-4deg)}
.hero .wrap{position:relative;z-index:1;padding:56px 18px;display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,72px);line-height:.94;margin:12px 0 16px;font-weight:1000;letter-spacing:-.06em;color:#fff}.hero p{font-size:18px;line-height:1.6;color:#dbeafe;max-width:650px}
.badge{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 12px;font-weight:1000;font-size:12px;background:#dcfce7;color:#166534;text-transform:uppercase;letter-spacing:.06em}.hero .badge{background:rgba(248,196,79,.14);color:#fde68a;border:1px solid rgba(248,196,79,.38)}
.btn{border:0;border-radius:15px;background:var(--green-dark);color:#fff;font-weight:1000;padding:12px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 12px 30px rgba(15,23,42,.10)}.btn.secondary{background:var(--gold);color:#07111f}.btn.ghost{background:#eef2f7;color:#0f172a}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 16px 40px rgba(15,23,42,.08)}.card h2,.card h3{margin-top:0}.card h2{font-size:25px;letter-spacing:-.04em}.card h3{font-size:20px;letter-spacing:-.03em}.section{padding:36px 0}.kpi{display:flex;gap:12px;align-items:center}.kpi strong{font-size:34px;color:var(--green-dark);font-weight:1000}.kpi:before{content:"⚽";width:48px;height:48px;border-radius:16px;background:#dcfce7;display:flex;align-items:center;justify-content:center;font-size:22px}
.table-wrap{overflow:auto;border-radius:20px;border:1px solid var(--line);background:#fff;box-shadow:0 10px 30px rgba(15,23,42,.06)}table{border-collapse:collapse;width:100%;font-size:13px}th{background:linear-gradient(135deg,var(--green-dark),#166534);color:#fff;text-align:left;padding:13px;white-space:nowrap;text-transform:uppercase;letter-spacing:.04em;font-size:11px}td{padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}tbody tr:hover{background:#f8fafc}
.score{font-weight:1000;background:#f1f5f9;border-radius:12px;padding:7px 10px;display:inline-block;color:#0f172a}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}select,input,textarea{border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14px;background:#fff;width:100%;outline:none}select:focus,input:focus,textarea:focus{border-color:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.14)}label{font-size:11px;font-weight:1000;color:#475569;text-transform:uppercase;letter-spacing:.07em}.form-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.footer{border-top:1px solid rgba(255,255,255,.10);background:#020617;color:#94a3b8;padding:32px 0;margin-top:34px}.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px}.footer strong{color:#fff}.footer p{margin:8px 0 0;line-height:1.5;font-size:13px}
.muted{color:var(--muted)}.player-card{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}.avatar{width:84px;height:84px;border-radius:22px;object-fit:cover;background:#e2e8f0;border:3px solid #dcfce7}.avatar-fallback{width:84px;height:84px;border-radius:22px;background:#dcfce7;color:#166534;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:20px}.player-meta{font-size:13px;color:#475569;line-height:1.55}.match-option{border:2px solid var(--line);border-radius:20px;padding:17px;background:#fff;cursor:pointer;transition:.15s ease;box-shadow:0 10px 25px rgba(15,23,42,.05)}.match-option:hover{transform:translateY(-1px);border-color:#bbf7d0}.match-option.selected{border-color:#22c55e;background:#f0fdf4}.roster-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:20px;padding:14px;min-height:140px}.roster-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border-radius:15px;background:#fff;border:1px solid var(--line);margin-bottom:8px}.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:18px;padding:14px;font-size:14px}.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:18px;padding:14px;font-size:14px}.loading{padding:42px;text-align:center;color:#64748b}.page-title{background:linear-gradient(135deg,#fff,#f8fafc);border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 12px 30px rgba(15,23,42,.06)}
@media(max-width:900px){.hero .wrap{grid-template-columns:1fr}.hero h1{font-size:40px}.grid-2,.grid-3,.form-row,.footer-grid{grid-template-columns:1fr}.league-strip-inner{display:none}.menu{overflow:auto;max-width:100%;justify-content:flex-start}.nav{align-items:flex-start;flex-direction:column}.player-card{grid-template-columns:70px 1fr}.avatar,.avatar-fallback{width:70px;height:70px;border-radius:18px}}
</style>
