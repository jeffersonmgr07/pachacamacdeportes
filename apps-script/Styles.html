<style>
:root{
  --navy:#07111f;
  --navy2:#0f172a;
  --green:#047857;
  --green2:#059669;
  --gold:#f5c542;
  --gold2:#d99b1f;
  --white:#ffffff;
  --muted:#64748b;
  --line:#e2e8f0;
  --bg:#f1f5f9;
  --danger:#b91c1c;
  --success:#047857;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#0f172a;font-family:Inter,Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1240px;margin:auto;padding:0 22px}.loading{padding:60px;text-align:center;color:var(--muted)}
.site-header{position:sticky;top:0;z-index:20;box-shadow:0 12px 28px rgba(2,6,23,.16)}
.league-strip{background:#020617;color:#cbd5e1;font-size:12px}.league-strip-inner{display:flex;justify-content:space-between;gap:12px;padding-top:7px;padding-bottom:7px}.main-nav-wrap{background:linear-gradient(90deg,#07111f,#0f172a 55%,#064e3b)}
.nav{display:flex;align-items:center;justify-content:space-between;min-height:78px}.brand{display:flex;align-items:center;gap:12px;color:white}.crest{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff9c2,#f5c542 45%,#b7791f 80%);color:#07111f;display:grid;place-items:center;font-weight:1000;border:3px solid rgba(255,255,255,.8);box-shadow:0 0 0 4px rgba(245,197,66,.15)}.brand small{display:block;color:#fcd34d;text-transform:uppercase;font-size:11px;font-weight:900;letter-spacing:.08em}.brand span{display:block;font-size:24px;font-weight:1000;letter-spacing:-.04em}.menu{display:flex;align-items:center;gap:4px;flex-wrap:wrap}.menu a{color:#e2e8f0;font-weight:800;font-size:14px;padding:11px 13px;border-radius:999px}.menu a:hover,.menu a.active{background:rgba(255,255,255,.12);color:white}.menu .admin-link{background:rgba(245,197,66,.16);color:#fde68a}.menu .login-link{background:white;color:#064e3b}.logout-link{cursor:pointer}
.hero{background:linear-gradient(135deg,rgba(7,17,31,.98),rgba(5,95,70,.94)),radial-gradient(circle at 70% 30%,rgba(245,197,66,.32),transparent 35%);color:white;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:auto -10% -50% auto;width:560px;height:560px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.045) 0 12px,transparent 12px 24px);border-radius:50%}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:34px;align-items:center;padding-top:76px;padding-bottom:76px;position:relative;z-index:1}.hero h1,.page-hero h1{font-size:clamp(38px,6vw,74px);line-height:.92;margin:14px 0;font-weight:1000;letter-spacing:-.06em}.hero p,.page-hero p{font-size:19px;line-height:1.6;color:#dbeafe;max-width:720px}.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.hero-card{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:28px;padding:24px;box-shadow:0 24px 65px rgba(2,6,23,.25)}.hero-card h2{margin-top:0}.mini-match{background:white;color:#0f172a;border-radius:18px;padding:13px;margin:10px 0;border-left:5px solid var(--gold)}
.page-hero{background:linear-gradient(135deg,#07111f,#0f172a 52%,#064e3b);color:white;padding:48px 0}.page-hero h1{font-size:clamp(34px,4.5vw,56px)}.page-hero p{margin:0;color:#cbd5e1}.section{padding:30px 0 54px}.sectionless{padding-top:4px}.card{background:white;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 14px 36px rgba(15,23,42,.08)}.card h2,.card h3{margin-top:0}.grid{display:grid;gap:18px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard-top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}.kpi strong{display:block;font-size:36px;font-weight:1000;color:#064e3b}.kpi span{color:var(--muted);font-weight:800}.badge{display:inline-flex;align-items:center;width:max-content;border-radius:999px;background:#e0f2fe;color:#075985;padding:6px 11px;font-weight:900;font-size:12px;text-transform:uppercase;letter-spacing:.05em}.badge.gold{background:rgba(245,197,66,.18);color:#facc15;border:1px solid rgba(245,197,66,.35)}.team-pill{padding:13px 14px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;font-weight:900}.muted{color:var(--muted)}.notice,.success,.error{border-radius:18px;padding:13px 15px;margin:12px 0;font-weight:800}.notice{background:#fffbeb;color:#92400e;border:1px solid #fde68a}.success{background:#ecfdf5;color:#065f46;border:1px solid #a7f3d0}.error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}.btn{border:0;border-radius:16px;background:linear-gradient(135deg,#f5c542,#d99b1f);color:#07111f;font-weight:1000;padding:13px 18px;cursor:pointer;box-shadow:0 10px 24px rgba(217,155,31,.25);display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{filter:brightness(.98);transform:translateY(-1px)}.btn.secondary{background:white;color:#064e3b}.btn.ghost{background:#f1f5f9;color:#0f172a;box-shadow:none;padding:8px 11px}.btn.full{width:100%;margin-top:14px}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line)}table{width:100%;border-collapse:collapse;background:white;min-width:760px}th{background:#0f172a;color:white;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.05em}th,td{padding:13px;border-bottom:1px solid #e2e8f0}tr:last-child td{border-bottom:0}.score{display:inline-flex;background:#0f172a;color:white;border-radius:12px;padding:6px 10px;font-weight:1000;margin:0 8px}.vs{color:#94a3b8;font-weight:900;margin:0 6px}.filters{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}.filters select{max-width:260px}
input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:15px;padding:12px 13px;font:inherit;background:white}label{display:block;font-weight:900;margin:12px 0 7px;color:#334155}.form-row{display:grid;gap:13px;align-items:start}.form-row.two{grid-template-columns:repeat(2,1fr)}.form-row.three{grid-template-columns:2fr 1fr 1fr}.form-row.four{grid-template-columns:2fr .7fr .7fr 1fr}.bottom{display:flex;align-items:end;height:100%}.auth-layout{display:grid;grid-template-columns:.85fr 1.15fr;gap:22px;align-items:start}.auth-card{position:relative;overflow:hidden}.auth-card:before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:linear-gradient(90deg,#064e3b,#f5c542,#0f172a)}.category-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 16px}.check-card{display:flex;flex-direction:column;gap:4px;border:1px solid #dbe3ec;border-radius:16px;padding:12px;background:#f8fafc;margin:0;cursor:pointer}.check-card input{width:auto}.check-card span{font-weight:1000}.check-card small{color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #cbd5e1;background:white;color:#334155;border-radius:999px;padding:11px 15px;font-weight:1000;cursor:pointer}.tab.active{background:#064e3b;color:white;border-color:#064e3b}.player-card{display:flex;gap:15px;align-items:flex-start}.player-card h3{margin:0 0 7px;font-size:16px}.player-meta{font-size:13px;line-height:1.55;color:#475569}.avatar,.avatar-fallback{width:78px;height:78px;border-radius:19px;flex:none;object-fit:cover;border:3px solid #e2e8f0}.avatar-fallback{display:grid;place-items:center;background:linear-gradient(135deg,#0f172a,#064e3b);color:#facc15;font-weight:1000;font-size:20px}.match-option{background:white;border:2px solid #e2e8f0;border-radius:22px;padding:18px;cursor:pointer;box-shadow:0 10px 26px rgba(15,23,42,.06)}.match-option:hover,.match-option.selected{border-color:#f5c542;background:#fffbeb}.callup-card{margin-top:22px}.roster-grid{margin-top:18px}.roster-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:20px;padding:12px;min-height:120px}.roster-item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:white;border:1px solid #e2e8f0;border-radius:16px;padding:10px;margin-bottom:8px;font-weight:900}.mini-row{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #e2e8f0;padding:12px 0}.mini-row:last-child{border-bottom:0}.site-footer{background:#07111f;color:#cbd5e1;padding:34px 0;margin-top:20px}.footer-grid{display:flex;align-items:center;justify-content:space-between;gap:18px}.footer-brand{font-weight:1000;color:white}.footer-brand span{color:#f5c542}

@media(max-width:560px){.category-picker{grid-template-columns:1fr}.wrap{padding:0 16px}.card{padding:18px}.hero h1,.page-hero h1{letter-spacing:-.04em}}
</style>
