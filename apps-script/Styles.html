
<style>
:root{
  --green:#166534; --green2:#22c55e; --lime:#84cc16; --dark:#0f172a;
  --muted:#64748b; --line:#e2e8f0; --bg:#f8fafc; --card:#ffffff;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--dark)}
a{color:inherit;text-decoration:none}
.header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0}
.brand{font-weight:900;color:var(--green);font-size:22px}
.menu{display:flex;gap:8px;flex-wrap:wrap}
.menu a{font-weight:700;font-size:13px;padding:9px 11px;border-radius:999px;color:#334155}
.menu a:hover,.menu a.active{background:#dcfce7;color:var(--green)}
.hero{background:linear-gradient(135deg,#14532d,#166534,#65a30d);color:#fff}
.hero .wrap{padding:50px 18px;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}
.hero h1{font-size:48px;line-height:1;margin:10px 0;font-weight:1000}
.hero p{font-size:18px;color:#ecfccb;max-width:620px}
.badge{display:inline-flex;border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;background:#dcfce7;color:#166534}
.hero .badge{background:rgba(255,255,255,.16);color:#fff}
.btn{border:0;border-radius:14px;background:var(--green);color:#fff;font-weight:900;padding:12px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.secondary{background:#fff;color:var(--green)}
.btn.ghost{background:#f1f5f9;color:#0f172a}
.btn.danger{background:#dc2626}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(2,6,23,.06)}
.card h2,.card h3{margin-top:0}
.section{padding:34px 0}
.kpi{display:flex;gap:12px;align-items:center}
.kpi strong{font-size:28px;color:var(--green)}
.table-wrap{overflow:auto;border-radius:18px;border:1px solid var(--line);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--green);color:#fff;text-align:left;padding:12px;white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
.score{font-weight:1000;background:#f1f5f9;border-radius:10px;padding:6px 10px;display:inline-block}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
select,input,textarea{border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;background:#fff;width:100%}
label{font-size:12px;font-weight:900;color:#475569;text-transform:uppercase;letter-spacing:.04em}
.form-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.footer{border-top:1px solid var(--line);background:#fff;color:var(--muted);padding:26px 0;margin-top:30px}
.muted{color:var(--muted)}
.player-card{display:grid;grid-template-columns:74px 1fr;gap:14px;align-items:center}
.avatar{width:74px;height:74px;border-radius:18px;object-fit:cover;background:#e2e8f0;border:2px solid #dcfce7}
.avatar-fallback{width:74px;height:74px;border-radius:18px;background:#dcfce7;color:#166534;display:flex;align-items:center;justify-content:center;font-weight:1000;font-size:20px}
.player-meta{font-size:13px;color:#475569;line-height:1.55}
.match-option{border:2px solid var(--line);border-radius:18px;padding:16px;background:#fff;cursor:pointer}
.match-option.selected{border-color:#22c55e;background:#f0fdf4}
.roster-box{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:18px;padding:14px;min-height:130px}
.roster-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;border-radius:14px;background:#fff;border:1px solid var(--line);margin-bottom:8px}
.notice{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:18px;padding:14px;font-size:14px}
.success{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:18px;padding:14px;font-size:14px}
.loading{padding:40px;text-align:center;color:#64748b}
@media(max-width:900px){
  .hero .wrap{grid-template-columns:1fr}.hero h1{font-size:38px}.grid-2,.grid-3,.form-row{grid-template-columns:1fr}
  .menu{overflow:auto;max-width:100%}.nav{align-items:flex-start;flex-direction:column}
}
</style>
