<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultados</title><link rel="stylesheet" href="assets/css/styles.css"></head><body>
<div data-header data-active="resultados" data-championship="true"></div>
<section class="page-title"><div class="container"><h1>Resultados</h1><p class="section-subtitle">Información del Torneo Municipal de Fútbol de Menores 2026.</p></div></section>
<section class="section" style="padding-top:10px"><div class="container">
<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Equipo</th><th>Resultado</th><th>Equipo</th><th>Tipo</th></tr></thead><tbody id="resultsBody"></tbody></table></div></div></section>

<div class="modal" id="loginModal">
  <div class="modal-dialog" style="width:min(520px,100%)">
    <div class="modal-header">
      <h3>Iniciar sesión</h3>
      <button class="modal-close" data-close-modal="loginModal">×</button>
    </div>
    <div class="modal-body">
      <form data-login-form>
        <div style="margin-bottom:14px"><label>Correo electrónico</label><input class="input" name="email" type="email" required placeholder="correo@ejemplo.com"></div>
        <div style="margin-bottom:14px"><label>Clave</label><input class="input" name="password" type="password" required placeholder="Clave temporal"></div>
        <button class="btn btn-primary" style="width:100%">Iniciar sesión</button>
      </form>
      <p style="color:#9fb1ca;margin-top:16px">¿No tienes acceso? Usa la opción de registro para solicitar activación al administrador.</p>
      <a class="btn btn-secondary" style="width:100%" href="registro.html">Registrarte</a>
    </div>
  </div>
</div>
<div data-footer></div>
<script src="assets/components/header.js"></script><script src="assets/components/footer.js"></script><script src="assets/js/config.js"></script><script src="assets/js/mock-data.js"></script><script src="assets/js/api.js"></script><script src="assets/js/login.js"></script><script src="assets/js/resultados.js"></script></body></html>
