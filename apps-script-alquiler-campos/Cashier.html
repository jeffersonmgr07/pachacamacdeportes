<!doctype html><html><head><base target="_top"><style>body{font-family:Arial,sans-serif;padding:14px;color:#172033}label{display:block;font-weight:700;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #ccd5e0;border-radius:8px}button{width:100%;padding:12px;margin-top:12px;border:0;border-radius:9px;background:#17365d;color:white;font-weight:700;cursor:pointer}.pay{background:#287a35}.card{margin-top:14px;padding:14px;border-radius:10px;background:#eef3f8}.error{color:#a51d2d}.ok{color:#236b31}small{color:#667085}</style></head><body><h2>Confirmar pago</h2><p><small>Busca el código mostrado por el cliente. El sistema valida automáticamente el vencimiento y los 10 minutos de gracia.</small></p><label>Código de reserva</label><input id="code" placeholder="PC-260716-ABCDE"><button onclick="search()">Buscar reserva</button><div id="result"></div><script>let current='';function search(){const c=document.getElementById('code').value.trim();document.getElementById('result').innerHTML='Buscando…';google.script.run.withSuccessHandler(show).withFailureHandler(err).cashierLookup(c)}function show(x){if(!x.ok){document.getElementById('result').innerHTML='<p class="error">'+x.message+'</p>';return}current=x.reservation.reservationCode;const r=x.reservation;document.getElementById('result').innerHTML='<div class="card"><b>'+r.venueName+'</b><p>'+new Date(r.startDateTime).toLocaleString('es-PE')+'<br>'+r.hours+' hora(s) · S/ '+Number(r.total).toFixed(2)+'</p><p>Cliente: '+r.firstName+' '+r.lastName+'<br>DNI: '+r.dni+'<br>Estado: <b>'+r.status+'</b></p><label>N.° de comprobante</label><input id="receipt"><button class="pay" onclick="pay()">Confirmar pago</button></div>'}function pay(){const receipt=document.getElementById('receipt').value.trim();if(!receipt&&!confirm('¿Confirmar sin número de comprobante?'))return;google.script.run.withSuccessHandler(x=>{document.getElementById('result').innerHTML='<p class="ok"><b>'+x.message+'</b></p>'}).withFailureHandler(err).cashierConfirmPayment(current,receipt)}function err(e){document.getElementById('result').innerHTML='<p class="error">'+e.message+'</p>'}</script></body></html>
