<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Equipos</title><link rel="stylesheet" href="assets/css/styles.css?v=20260601-uiroles"></head><body>
<div data-header data-active="equipos" data-championship="true"></div>
<section class="page-title"><div class="container"><h1>Equipos</h1><p class="section-subtitle">Información del Torneo Municipal de Fútbol de Menores 2026.</p></div></section>
<section class="section" style="padding-top:10px"><div class="container"><div id="teamsGrid" class="grid grid-3"></div></div></section>

<div class="modal" id="loginModal">
  <div class="modal-dialog" style="width:min(520px,100%)">
    <div class="modal-header">
      <h3>Iniciar sesión</h3>
      <button class="modal-close" data-close-modal="loginModal">×</button>
    </div>
    <div class="modal-body">
      <form data-login-form>
        <div style="margin-bottom:14px"><label>Correo, usuario o DNI</label><input class="input" name="email" type="text" autocomplete="username" required placeholder="correo@ejemplo.com"></div>
        <div style="margin-bottom:14px"><label>Contraseña</label><input class="input" name="password" type="password" autocomplete="current-password" required placeholder="Ingresa tu contraseña"></div>
        <button class="btn btn-primary" style="width:100%">Iniciar sesión</button>
      </form>
      <p style="color:#9fb1ca;margin-top:16px">Regístrate como delegado o entrenador si tienes algún equipo a tu cargo.</p>
      <a class="btn btn-secondary" style="width:100%" href="registro.html">Registrarte</a>
    </div>
  </div>
</div>
<div data-footer></div>
<script src="assets/components/header.js?v=20260601-uiroles"></script><script src="assets/components/footer.js"></script><script src="assets/js/config.js"></script><script src="assets/js/mock-data.js"></script><script src="assets/js/api.js?v=20260601-uiroles"></script><script src="assets/js/login.js?v=20260601-uiroles"></script><script src="assets/js/equipos.js"></script></body></html>
