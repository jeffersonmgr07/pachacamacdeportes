<!doctype html><html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Caja Clausura 2026</title><style>
:root{--red:#7c1e15;--red2:#d33a18;--gold:#ffca28;--ink:#142238;--bg:#eef2f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--ink)}.header{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;padding:24px}.shell{max-width:1040px;margin:24px auto;padding:0 16px}.panel{background:#fff;border:1px solid #dce4ee;border-radius:24px;padding:22px;box-shadow:0 18px 45px rgba(15,23,42,.10);margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr auto;gap:12px}label{display:block;font-weight:bold;color:#43536a;margin-bottom:6px}input,select{width:100%;padding:12px 13px;border:1px solid #ccd7e4;border-radius:13px;font:inherit}.btn{border:0;border-radius:13px;padding:12px 17px;font-weight:bold;cursor:pointer;background:#b7db2a;color:#071225}.btn.secondary{background:#eef2f7;border:1px solid #d5dee9}.btn:disabled{opacity:.55}.card{border:1px solid #dce4ee;border-radius:18px;padding:16px;margin-top:16px}.row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-top:1px solid #e6ebf1}.row:first-child{border-top:0}.badge{display:inline-flex;border-radius:999px;padding:7px 10px;background:#ffedd5;color:#9a3412;font-size:12px;font-weight:bold}.error{background:#fee2e2;color:#991b1b;padding:12px;border-radius:13px}.ok{background:#dcfce7;color:#166534;padding:12px;border-radius:13px}.muted{color:#687990}.pending-item{display:grid;grid-template-columns:1fr auto;gap:12px;border-top:1px solid #e7ecf2;padding:12px 0}.modal{position:fixed;inset:0;background:rgba(2,8,23,.75);display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal-box{background:#fff;border-radius:24px;padding:28px;width:min(480px,100%);text-align:center}@media(max-width:650px){.grid{grid-template-columns:1fr}.pending-item{grid-template-columns:1fr}}
</style></head><body><div class="header"><h1 style="margin:0">Caja - Campeonato Clausura 2026</h1><p style="margin:8px 0 0">Registro de pagos de inscripción por equipo y categoría.</p></div><main class="shell"><section class="panel"><p id="cashierContext" class="muted">Validando acceso…</p><div class="grid"><div><label for="code">Código de pago o inscripción</label><input id="code" placeholder="ORD-CL26-... o CL26-..."></div><button class="btn" onclick="lookup()">Buscar</button></div><div id="result"></div></section><section class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><h2 style="margin:0">Órdenes pendientes</h2><p class="muted">Últimas 100 órdenes registradas.</p></div><button class="btn secondary" onclick="loadPending()">Actualizar</button></div><div id="pending"></div></section></main><div class="modal" id="successModal"><div class="modal-box"><h2>Pago registrado</h2><p>La inscripción quedó activa y se envió el correo al delegado.</p><button class="btn" onclick="closeModal()">Aceptar</button></div></div><script>
let currentOrder='';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>new Intl.NumberFormat('es-PE',{style:'currency',currency:'PEN'}).format(Number(v||0));const dt=v=>{const d=new Date(v);return isNaN(d)?'':d.toLocaleString('es-PE')};
function init(){google.script.run.withSuccessHandler(x=>{document.getElementById('cashierContext').textContent='Sesión autorizada: '+x.email;loadPending();}).withFailureHandler(showFatal).cashierGetContext();}
function showFatal(e){document.body.innerHTML='<main class="shell"><div class="panel error">'+esc(e.message||e)+'</div></main>';}
function lookup(){const code=document.getElementById('code').value.trim(),box=document.getElementById('result');box.innerHTML='<p class="muted">Buscando…</p>';google.script.run.withSuccessHandler(showResult).withFailureHandler(e=>box.innerHTML='<p class="error">'+esc(e.message||e)+'</p>').cashierLookup(code);}
function showResult(x){const box=document.getElementById('result');if(!x.ok){box.innerHTML='<p class="error">'+esc(x.message)+'</p>';return;}const r=x.registration,o=x.order;currentOrder=o.orderCode;box.innerHTML='<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">'+esc(r.teamName)+'</h2><p class="muted">'+esc(r.registrationId)+'</p></div><span class="badge">'+esc(x.statusLabel)+'</span></div><div class="row"><span>Representante</span><strong>'+esc(r.representativeName)+'</strong></div><div class="row"><span>Categorías</span><strong>'+esc((x.categories||[]).map(c=>c.label||c.name).join(', '))+'</strong></div><div class="row"><span>Código de pago</span><strong>'+esc(o.orderCode)+'</strong></div><div class="row"><span>Total</span><strong>'+money(o.amount)+'</strong></div><div class="row"><span>Fin del plazo</span><strong>'+esc(dt(o.graceDeadline))+'</strong></div>'+(String(o.status).toUpperCase()==='PAGADO'?'<p class="ok">Esta orden ya fue pagada.</p>':'<label for="receipt">N.° de comprobante</label><input id="receipt" placeholder="Opcional"><button id="confirmButton" class="btn" style="width:100%;margin-top:12px" onclick="confirmPay()">Confirmar pago</button>')+'</div>';}
function confirmPay(){const button=document.getElementById('confirmButton'),receipt=document.getElementById('receipt').value.trim();if(!receipt&&!confirm('¿Confirmar el pago sin número de comprobante?'))return;button.disabled=true;button.textContent='Registrando…';google.script.run.withSuccessHandler(x=>{if(!x.ok){button.disabled=false;button.textContent='Confirmar pago';alert(x.message);return;}document.getElementById('successModal').classList.add('open');loadPending();}).withFailureHandler(e=>{button.disabled=false;button.textContent='Confirmar pago';alert(e.message||e)}).cashierConfirmPayment(currentOrder,receipt);}
function closeModal(){document.getElementById('successModal').classList.remove('open');document.getElementById('code').value='';document.getElementById('result').innerHTML='';document.getElementById('code').focus();}
function loadPending(){const box=document.getElementById('pending');box.innerHTML='<p class="muted">Cargando…</p>';google.script.run.withSuccessHandler(x=>{box.innerHTML=(x.items||[]).map(item=>'<div class="pending-item"><div><strong>'+esc(item.teamName)+'</strong><div class="muted">'+esc(item.orderCode)+' · '+money(item.amount)+' · vence '+esc(dt(item.graceDeadline))+'</div></div><button class="btn secondary" onclick="selectOrder(\''+esc(item.orderCode)+'\')">Abrir</button></div>').join('')||'<p class="muted">No hay órdenes pendientes.</p>';}).withFailureHandler(e=>box.innerHTML='<p class="error">'+esc(e.message||e)+'</p>').cashierPendingOrders();}
function selectOrder(code){document.getElementById('code').value=code;lookup();scrollTo({top:0,behavior:'smooth'});}init();
</script></body></html>
